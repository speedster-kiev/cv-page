      Formed through the acquisition and merger of ALD Automotive and LeasePlan — two of the world's largest fleet management companies — creating a global mobility leader managing ~3.3 million vehicles worldwide and serving enterprise clients such as LEGO, STARK, and NCC.
    title: Engineering Manager
    start: "2024"
    end: "2026"
    summary: |-
      Led two product teams (10 engineers across Denmark and an offshore outstaffing partner in India) within the Nordic IT Hub, working on enterprise mobility platforms, customer self-service solutions, and integrations with the Miles ERP system and across legacy and modern systems.

      Responsible for people development, delivery reliability, technical direction, and hiring. Partnered closely with engineers on system design, integrations, and production issues.
    achievements:
      - >-
        Improved delivery predictability across two distributed teams by introducing clearer prioritization, strengthening collaboration with business stakeholders, and addressing dependency bottlenecks, achieving ~80% on-time delivery
      - >-
        Led IT landscape integration across the ALD Automotive and LeasePlan merger — responsible for merging the customer-facing self-service applications used by drivers, fleet managers, and partners; coordinated cross-team dependencies and aligned stakeholders across two global organisations, consolidating systems into a unified architecture under the new Ayvens brand with no P1 incidents recorded
      - >-
        Challenged a requested search-result field-configuration feature that the team had estimated at 6-8 weeks and two other teams' involvement: went to the business for actual usage data, found a handful of customers wanted different defaults but none needed to change them on an ongoing basis, and shipped a per-customer JSON config with a standard default instead, meeting every customer's need and avoiding the build entirely
      - >-
        Built an internal tool automating compliance reporting, delegating the implementation to coding agents and reviewing the generated code for correctness and maintainability
      - >-
        Designed the security and scaling model for a public-facing vehicle pickup request feature: single-use, hashed URLs emailed only to the customer, rate limiting and CAPTCHA against automated abuse, and a scheduled job pre-computing valid vehicle records so any hash not matching a real, in-window record was rejected outright — decoupled from the Miles ERP system via a queue built on the platform team's infrastructure so the public form's load could never reach it directly
      - >-
        Built a Microsoft Teams bot (Node.js, Terraform) giving the development team visibility into what was actually deployed to production, closing a gap where changes went live without the team's knowledge — a gap that had caused friction with the business, especially when production issues couldn't be traced or verified in time
      - >-
        Acted as sparring partner for the Product Owner on UX, prototyping, design tools, usability testing and customer journey optimization
      - >-
        Built a psychologically safe team environment through coaching, knowledge sharing, and structured collaboration, increasing ownership and engineering quality
      - >-
        Mentored a developer from junior to senior level
      - >-
        Worked closely with the test team to ensure quality across teams
      - >-
        Ensured security, GDPR and compliance governance aligned with NIS2 framework and internal banking-licence controls, including internal reporting and audit processes — the team passed every audit (Ayvens holds a banking licence in multiple Nordic jurisdictions)
      - >-
        Drove grass-roots AI adoption in the team through hands-on workshops, and kicked off early-stage investigation into AI-assisted code reviews and automated E2E test generation (CoPilot + Playwright)

