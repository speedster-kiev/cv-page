name: Maksym Karazieiev
headline: Engineering Manager
photo:
  file: photo.jpg
  alt: Portrait of Maksym Karazieiev

summary: |-
  Engineering Manager with 20+ years in software, from engineer and lead engineer to leading distributed product teams in regulated enterprise environments. Most recently at Ayvens, responsible for two teams across Denmark and offshore through the ALD Automotive and LeasePlan merger, under NIS2 and banking-licence controls. I have worked with and led mixed teams where developers and testers came from outstaffing partners in Romania, Vietnam, Bulgaria and India, working inside my teams rather than alongside them, and worked with stakeholders across four Nordic countries at Ayvens, and in the UK and Denmark earlier in my career. I believe teams deliver their best when the system around them is clear.

  I lead from within the team. My engineering background lets me engage directly in architecture and production issues, and weigh technical choices against business value and risk. I adapt my leadership to where each person is, and treat growing engineers, hiring well and building a culture of ownership as core parts of the role.

  My focus is predictable delivery: clear priorities, visible dependencies, and requirements tested against real needs before they are built. In practice that has meant consolidating customer-facing platforms across the merger with no P1 incidents, reducing an offshore team's cycle time from ~48 to 16 days, and passing every audit under banking-licence controls.

